<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F2EE">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0B0A">
    <meta name="generator" content="Promethity (built on the IPFS Web UI, MIT, Protocol Labs) https://github.com/GQAdonis/ipfs-webui">
    <meta name="revision" content="%REACT_APP_GIT_REV%">
    <meta name="description" content="Promethity is a web interface for your own IPFS node. Check node stats, explore the IPLD merkle forest, see libp2p peers around the world and manage your files, without needing to touch the CLI. Built on the IPFS Web UI (MIT, Protocol Labs).">
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48">
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png">
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Promethity</title>
    <link rel="canonical" href="https://webui.ipfs.io/">
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>


    <div id="root"></div>

        To create a production bundle, use `npm run build` or `yarn build`.
      -->
    <div id="portal-dropdown" class="fixed top-0 left-0"></div>
  </body>
</html>
